name: Build and Release ScryForge

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Resolve previous tag (semantic order)
        id: prev_tag
        shell: pwsh
        run: |
          git fetch --tags
          $current = "${{ github.ref_name }}"
          $tags = git tag --list "v*" --sort=-v:refname
          $prev = $tags | Where-Object { $_ -ne $current } | Select-Object -First 1

          echo "PREV_TAG=$prev" >> $env:GITHUB_OUTPUT

      - name: Collect commits (feat, fix, perf)
        id: commits
        shell: pwsh
        run: |
          $prevTag = "${{ steps.prev_tag.outputs.PREV_TAG }}"

          if ($prevTag) {
            $rawCommits = git log "$prevTag..HEAD" --pretty=format:"%s"
          } else {
            $rawCommits = git log HEAD --pretty=format:"%s"
          }

          # Filter alleen de user-facing commit types: feat, fix, perf
          # Sluit bump commits uit
          $filtered = $rawCommits |
            ForEach-Object { $_.Trim() } |
            Where-Object { ($_ -match '^(feat|fix|perf):') -and ($_ -notmatch 'bump version') } |
            ForEach-Object { "- $_" }

          # Als er geen commits overblijven
          if (-not $filtered) {
            $filtered = "- No user-facing changes."
          }

          # Output als multiline voor GitHub Actions
          echo "COMMITS<<EOF" >> $env:GITHUB_OUTPUT
          $filtered | Out-String | ForEach-Object { $_.TrimEnd() } >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Publish project
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          dotnet publish ScryForge.csproj `
            --configuration Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=true `
            /p:EnableCompressionInSingleFile=true `
            /p:DebugType=None `
            /p:Version=$env:APP_VERSION `
            /p:AssemblyVersion=$env:APP_VERSION.0 `
            /p:FileVersion=$env:APP_VERSION.0 `
            /p:InformationalVersion=$env:APP_VERSION `
            --output ./publish

      - name: Compress build output
        shell: pwsh
        run: |
          Compress-Archive -Path "./publish/*" `
            -DestinationPath "ScryForge_${{ github.ref_name }}.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScryForge ${{ github.ref_name }}
          body: |
            Automatic release of ScryForge

            **Version:** ${{ steps.version.outputs.VERSION }}
            **Previous tag:** ${{ steps.prev_tag.outputs.PREV_TAG }}

            **Changes since last release:**
            ${{ steps.commits.outputs.COMMITS }}
          files: "ScryForge_${{ github.ref_name }}.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
