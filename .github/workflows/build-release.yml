name: Build and Release ScryForge

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger only on version tags like v1.0.30

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)  # Remove the 'v' prefix
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Build version set to: $version"

      - name: Publish project
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          Write-Host "Publishing with version: $env:APP_VERSION (clean version, no commit hash)"
          dotnet publish ScryForge.csproj `
            --configuration Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=true `
            /p:EnableCompressionInSingleFile=true `
            /p:IncludeAllContentForSelfExtract=false `
            /p:DebugType=None `
            /p:Version=$env:APP_VERSION `
            /p:AssemblyVersion=$env:APP_VERSION.0 `
            /p:FileVersion=$env:APP_VERSION.0 `
            /p:InformationalVersion=$env:APP_VERSION `
            /p:IncludeSourceRevisionInInformationalVersion=false `
            --output ./publish

      - name: Compress build output
        shell: pwsh
        run: |
          $zipName = "ScryForge_${{ github.ref_name }}.zip"
          Compress-Archive -Path "./publish/*" -DestinationPath $zipName -Force
          Write-Host "ZIP created: $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScryForge ${{ github.ref_name }}
          body: |
            Automatic release of ScryForge

            **Version:** ${{ steps.version.outputs.VERSION }}            
          files: "ScryForge_${{ github.ref_name }}.zip"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}