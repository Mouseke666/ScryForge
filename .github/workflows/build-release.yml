name: Build and Release ScryForge

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Build version set to: $version"

      - name: Resolve previous tag (semantic version order)
        id: prev_tag
        shell: pwsh
        run: |
          git fetch --tags

          $currentTag = "${{ github.ref_name }}"
          $tags = git tag --list "v*" --sort=-v:refname

          Write-Host "All tags sorted by version:"
          $tags | ForEach-Object { Write-Host " - $_" }

          $prevTag = $tags | Where-Object { $_ -ne $currentTag } | Select-Object -First 1

          if ($prevTag) {
            echo "PREV_TAG=$prevTag" >> $env:GITHUB_OUTPUT
            Write-Host "Previous tag resolved to: $prevTag"
          } else {
            echo "PREV_TAG=" >> $env:GITHUB_OUTPUT
            Write-Host "No previous tag found"
          }

      - name: Collect commits since previous tag
        id: commits
        shell: pwsh
        run: |
          $prevTag = "${{ steps.prev_tag.outputs.PREV_TAG }}"

          if ($prevTag) {
            Write-Host "Collecting commits from $prevTag to HEAD"
            $commits = git log "$prevTag..HEAD" --pretty=format:"- %s (%an)"
          } else {
            Write-Host "No previous tag; collecting full history"
            $commits = git log HEAD --pretty=format:"- %s (%an)"
          }

          if (-not $commits) {
            $commits = "No commits found."
          }

          Write-Host "Commits found:"
          Write-Host $commits

          echo "COMMITS<<EOF" >> $env:GITHUB_OUTPUT
          echo "$commits" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Publish project
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          Write-Host "Publishing version $env:APP_VERSION"
          dotnet publish ScryForge.csproj `
            --configuration Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=true `
            /p:EnableCompressionInSingleFile=true `
            /p:IncludeAllContentForSelfExtract=false `
            /p:DebugType=None `
            /p:Version=$env:APP_VERSION `
            /p:AssemblyVersion=$env:APP_VERSION.0 `
            /p:FileVersion=$env:APP_VERSION.0 `
            /p:InformationalVersion=$env:APP_VERSION `
            /p:IncludeSourceRevisionInInformationalVersion=false `
            --output ./publish

      - name: Compress build output
        shell: pwsh
        run: |
          $zipName = "ScryForge_${{ github.ref_name }}.zip"
          Compress-Archive -Path "./publish/*" -DestinationPath $zipName -Force
          Write-Host "ZIP created: $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScryForge ${{ github.ref_name }}
          body: |
            Automatic release of ScryForge

            **Version:** ${{ steps.version.outputs.VERSION }}

            **Previous tag:** ${{ steps.prev_tag.outputs.PREV_TAG }}

            **Changes since last release:**
            ${{ steps.commits.outputs.COMMITS }}
          files: "ScryForge_${{ github.ref_name }}.zip"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
