name: Build and Release ScryForge

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger op tags zoals v1.0.23

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Veilig voor toekomstige uitbreidingen

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Set version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)  # Verwijder de 'v'
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Versie ingesteld op: $version"

      - name: Publish project
        run: |
          dotnet publish ScryForge.csproj `
            --configuration Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishTrimmed=true `
            /p:EnableCompressionInSingleFile=true `
            /p:IncludeAllContentForSelfExtract=false `
            /p:DebugType=None `
            /p:Version=${{ steps.version.outputs.VERSION }} `
            /p:AssemblyVersion=${{ steps.version.outputs.VERSION }}.0 `
            /p:FileVersion=${{ steps.version.outputs.VERSION }}.0 `
            /p:InformationalVersion=${{ steps.version.outputs.VERSION }} `
            --output ./publish

      - name: Compress build output
        shell: pwsh
        run: |
          $zipName = "ScryForge_${{ github.ref_name }}.zip"
          Compress-Archive -Path "./publish/*" -DestinationPath $zipName -Force
          Write-Output "ZIP aangemaakt: $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScryForge ${{ github.ref_name }}
          body: |
            Automatische release van ScryForge
            
            **Versie:** ${{ steps.version.outputs.VERSION }}
            
            Gebouwd op: ${{ github.event.head_commit.timestamp }}
          files: "ScryForge_${{ github.ref_name }}.zip"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}